<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="230" rx="10" ry="10" fill="#0d0f1a"/>

  <!-- Top bar -->
  <rect width="720" height="32" rx="10" ry="10" fill="#161825"/>
  <rect y="22" width="720" height="10" fill="#161825"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>

  <!-- Title -->
  <text x="360" y="21" text-anchor="middle" fill="#666e8a" font-size="12">profile.conf — bash</text>

  <!-- Line 1: IDENTITY.init() -->
  <text x="30" y="62" fill="#4a5270" font-size="12">IDENTITY.init()</text>

  <!-- Line 2: $ cat ./profile.conf -->
  <text x="30" y="90">
    <tspan fill="#00e5ff" font-weight="700">$</tspan>
    <tspan fill="#8892b0"> cat </tspan>
    <tspan fill="#cdd6f4">./profile.conf</tspan>
  </text>

  <!-- Line 3: role -->
  <text x="30" y="118">
    <tspan fill="#a78bfa" font-weight="700">&gt;</tspan>
    <tspan fill="#f472b6" font-weight="700"> role   </tspan>
    <tspan fill="#8892b0">= </tspan>
    <tspan fill="#cdd6f4">"Java Software Developer | Systems Architect"</tspan>
  </text>

  <!-- Line 4: stack -->
  <text x="30" y="146">
    <tspan fill="#a78bfa" font-weight="700">&gt;</tspan>
    <tspan fill="#f472b6" font-weight="700"> stack  </tspan>
    <tspan fill="#8892b0">= </tspan>
    <tspan fill="#cdd6f4">"Java / C / Python / Spring Boot"</tspan>
  </text>

  <!-- Line 5: focus -->
  <text x="30" y="174">
    <tspan fill="#a78bfa" font-weight="700">&gt;</tspan>
    <tspan fill="#f472b6" font-weight="700"> focus  </tspan>
    <tspan fill="#8892b0">= </tspan>
    <tspan fill="#cdd6f4">"High-throughput APIs · Microservices · Systems Design"</tspan>
  </text>

  <!-- Line 6: status -->
  <text x="30" y="202">
    <tspan fill="#a78bfa" font-weight="700">&gt;</tspan>
    <tspan fill="#f472b6" font-weight="700"> status </tspan>
    <tspan fill="#8892b0">= </tspan>
    <tspan fill="#cdd6f4">"Seeking high-impact engineering roles"</tspan>
  </text>
</svg>
